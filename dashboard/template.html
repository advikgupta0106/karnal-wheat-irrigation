<title>Karnal Wheat Irrigation Advisor</title>

<style>
/* One screen at a time. Bottom tab bar on phones, left sidebar from 900px up. */
/* Earth & Harvest. Token NAMES are unchanged on purpose: chart() and gauge() build SVG
   strings referencing var(--teal), --mint, --coral, --gold and --pale, and that JS is
   off limits, so the palette is re-pointed here instead of renamed. */
:root{--deep:#263F35;      /* sidebar, bottom nav, hero when NOT irrigating, buttons */
 --harvest:#D18B43;        /* hero when the answer is IRRIGATE */
 --teal:#617B55;           /* chart primary */
 --mint:#8FA87C;           /* chart area fill and the rain bars */
 --pale:#E9DFC9;           /* active nav, gauge track, tags */
 --gold:#D18B43;           /* projection line, 'YES' text */
 --coral:#B4543F;           /* trigger line, deficit-now figure */
 --white:#FAF7EF;          /* page background */
 --ink:#333A32; --mut:#68766E; --card:#FFFFFF; --line:#DDE4D9;
 --font:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{background:#FAF7EF;color:#333A32;font-family:var(--font);margin:0;font-size:15px;line-height:1.45}
/* Slim honesty strip, fixed to the top of every screen. */
.strip{position:fixed;top:0;left:0;right:0;z-index:40;background:#E9DFC9;border-bottom:1px solid #DDE4D9;color:#68766E;font-size:12px;line-height:1.35;
 padding:7px max(12px,env(safe-area-inset-right,0px)) 7px max(12px,env(safe-area-inset-left,0px));padding-top:calc(7px + env(safe-area-inset-top,0px));text-align:center}
.app{padding-top:52px;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.back[hidden]{display:none}
.topbar{display:flex;align-items:center;gap:10px;padding:10px max(14px,env(safe-area-inset-left,0px));position:sticky;top:52px;background:#FAF7EF;z-index:30;border-bottom:1px solid var(--line)}
.back{appearance:none;border:1px solid #DDE4D9;background:#FFFFFF;color:#263F35;border-radius:8px;min-width:44px;min-height:44px;font-size:20px;font-weight:700;cursor:pointer;display:grid;place-items:center;flex:none}
.title{font-size:19px;font-weight:800;color:var(--deep);letter-spacing:-.01em;margin:0}
.scr{padding:14px max(14px,env(safe-area-inset-left,0px)) 20px max(14px,env(safe-area-inset-right,0px));display:grid;gap:12px;max-width:760px;margin:0 auto}
/* Bottom tab bar: five targets, each at least 44px tall. */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);background:#263F35;border-top:1px solid #263F35;
 padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs a{min-height:56px;display:grid;place-items:center;gap:3px;text-decoration:none;color:rgba(255,255,255,.72);font-size:11px;font-weight:600;padding:7px 2px}
.tabs a.on{color:#E9DFC9}
.tabs i{width:18px;height:18px;border-radius:6px;background:currentColor;opacity:.45}
.tabs a.on i{opacity:1}
.sidebar{display:none}
.card{background:#FFFFFF;border-radius:16px;padding:20px;border:1px solid #DDE4D9;box-shadow:none}
.hero{background:#263F35;color:#FFFFFF;border-radius:16px;padding:20px;border:0;box-shadow:none}
.hero:has(.yes){background:#D18B43}
.yes{color:#FFFFFF}.no{color:#E9DFC9}
.hero small{opacity:.85;font-size:11px;text-transform:uppercase;letter-spacing:.06em;display:block}
.big{font-size:44px;font-weight:800;letter-spacing:-.02em;line-height:1}
.pill{display:inline-block;border-radius:999px;padding:6px 12px;font-weight:700;font-size:12px;background:rgba(255,255,255,.16);color:var(--white)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.two>*{min-width:0}
.k{color:var(--mut);font-size:12.5px;line-height:1.4}
.v{font-size:26px;font-weight:800;color:var(--ink);line-height:1.15;font-variant-numeric:tabular-nums}
.v small{font-size:13px;font-weight:600;color:var(--mut)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}.row b{font-weight:600;text-align:right}
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:3px 8px;background:var(--pale);color:var(--deep)}
.tag.gold{background:#f6e6c3;color:#6b4a07}
/* Menu rows on the Water and More index screens. */
.menu{display:grid;gap:10px}
.menu a{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:56px;text-decoration:none;color:inherit;
 background:#FFFFFF;border:1px solid #DDE4D9;border-radius:16px;padding:16px 20px}
.menu b{display:block;font-size:15px;color:var(--deep)}
.menu span{color:var(--mut);font-size:12.5px}
.menu .chev{color:var(--mut);font-size:20px;flex:none}
input,select{font:600 15px var(--font);color:#333A32;background:#FFFFFF;border:1px solid #DDE4D9;border-radius:8px;padding:10px;width:100%;min-width:0;min-height:44px}
input:focus-visible,select:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.f{display:grid;gap:4px}.f label{font-size:12.5px;color:var(--mut)}
.fl{display:grid;gap:12px}
.reset{font:700 14px var(--font);color:#FFFFFF;background:#263F35;border:1px solid #263F35;border-radius:8px;min-height:44px;padding:10px;cursor:pointer;width:100%}
svg{max-width:100%;height:auto}
svg text{font-family:var(--font);fill:var(--mut);font-size:8px}
.tl{display:grid}.st{display:grid;grid-template-columns:20px 1fr;gap:10px;padding-bottom:14px;position:relative}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--pale);background:var(--card);margin-top:3px;z-index:1}
.st.done .dot{background:var(--teal);border-color:var(--teal)}.st.now .dot{border-color:var(--gold);background:var(--gold)}
.st:not(:last-child):after{content:"";position:absolute;left:7px;top:19px;bottom:-3px;width:2px;background:var(--pale)}
.why{display:grid;grid-template-columns:16px 1fr;gap:10px;padding:7px 0;line-height:1.45;font-size:13.5px}
.why i{width:13px;height:13px;border-radius:50%;background:var(--mint);margin-top:4px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-top:8px}
.about h3{font-size:15px;color:var(--deep);margin:14px 0 4px}.about h3:first-child{margin-top:0}
.about p,.about li{font-size:13.5px;color:var(--mut);margin:5px 0}
.about ul{padding-left:18px;margin:5px 0}
@media (min-width:900px){
 .strip{text-align:center}
 .app{display:grid;grid-template-columns:232px minmax(0,1fr);padding-bottom:28px;max-width:1180px;margin:0 auto}
 .tabs{display:none}
 .sidebar{display:block;position:sticky;top:52px;align-self:start;padding:18px 12px;height:calc(100vh - 52px);background:#263F35;border-radius:0 16px 16px 0}
 .sidebar a{display:flex;align-items:center;gap:10px;min-height:46px;padding:10px 12px;border-radius:8px;text-decoration:none;color:rgba(255,255,255,.78);font-weight:600;font-size:14.5px}
 .sidebar a.on{background:#E9DFC9;color:#263F35}
 .sidebar i{width:16px;height:16px;border-radius:5px;background:currentColor;opacity:.5}
 .sidebar a.on i{opacity:1}
 .brand{font-size:14px;font-weight:800;color:#FFFFFF;padding:0 12px 14px;line-height:1.3}
 .topbar{top:52px}
 .scr{max-width:720px;padding-top:18px}
 .two{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
}
</style>
<div class="strip" role="note">Prototype. Replays archived Karnal weather to __ASOF__. Not a live system. Not expert farm advice.</div>
<div class="app">
 <nav class="sidebar" id="sidebar" aria-label="Sections"></nav>
 <main>
  <div class="topbar"><button class="back" id="back" type="button" aria-label="Back" hidden>&lsaquo;</button><h1 class="title" id="title">Home</h1></div>
  <div class="scr" id="scr"></div>
 </main>
</div>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<script>
const D=__DATA__;
const N=D.dates.length, LAST=N-1, ASOF=D.dates[LAST];
/* Trigger scenarios, not soil measurements. FAO-56 sets the trigger from soil texture
   and rooting depth; we have neither for Karnal, so these are the notebook's scenarios. */
const TRIGGERS=[40,60,80], ACRE_HA=0.4047;
/* The replay season is DERIVED from the data, never hardcoded. Wheat seasons run
   Nov -> Mar and are labelled by the November year (2025-26 = Nov 2025 to Mar 2026). */
const seasonYear=(d)=>{const y=+d.slice(0,4),m=+d.slice(5,7);return m>=11?y:(m<=3?y-1:null)};
const SEASON_Y=seasonYear(ASOF)??(+ASOF.slice(0,4)-1);
const SEASON=`${SEASON_Y}-${String(SEASON_Y+1).slice(2)}`;
const clampDate=(d,lo,hi)=>d<lo?lo:(d>hi?hi:d);
const SOW_MIN=clampDate(`${SEASON_Y}-11-01`,D.dates[0],ASOF), SOW_MAX=clampDate(`${SEASON_Y}-12-15`,D.dates[0],ASOF);
const DEF={area:1,areaUnit:'hectares',trig:60,sow:clampDate(`${SEASON_Y}-11-15`,SOW_MIN,SOW_MAX),last:'',rainTom:0,wx:{et0:D.et0[LAST],tmax:D.tmax[LAST],tmin:D.tmin[LAST],rh:D.rh[LAST],wind:D.wind[LAST],rad:D.rad[LAST],rain:D.rain[LAST]}};
let S=JSON.parse(JSON.stringify(DEF));
/* Tomorrow's ET0 = today's ET0 (the notebook's persistence rule). */
/* ---- OUR MODEL: the Step 4 pipeline, exported from the notebook ---------------------
   M holds the 11 feature names, the StandardScaler's mean_ and scale_, the regression
   coefficients and the intercept. Nothing is fitted here: these numbers were fitted in
   notebook Cell 20 on the training seasons only, and exported unchanged. */
const M=__MODEL__;

/* Build the 11-feature vector for the as-of day, in the EXACT order M.features gives.
   i is the index of "today" in the daily series; the model predicts the next day. */
function features(i,wx){
 // Today's seven weather values. They come from the Weather screen's inputs, which are
 // pre-filled from the daily series, so edits on that screen feed straight into the model.
 const et0=Math.max(0,+wx.et0||0);
 // day_of_season counts from 1 November of the season the day belongs to, as in the notebook.
 const y=+D.dates[i].slice(0,4), m=+D.dates[i].slice(5,7);
 const startYear=m>=11?y:y-1;                      // Nov-Dec belong to this year's season
 const dos=Math.round((new Date(D.dates[i]+'T00:00:00')-new Date(startYear+'-11-01T00:00:00'))/864e5);
 // The three lag features, read from the archived series rather than from the inputs:
 // yesterday's ET0, the 3-day mean INCLUDING today, and today minus yesterday.
 const yest=i>0?D.et0[i-1]:et0;                    // shift(1) in pandas
 const mean3=i>1?(et0+D.et0[i-1]+D.et0[i-2])/3:et0; // rolling(3) includes today
 const chg=et0-yest;                               // et0_change = today - yesterday
 // The order below must match M.features exactly, or every coefficient lands on the wrong number.
 const by={et0_fao_evapotranspiration:et0,temperature_2m_max:+wx.tmax,temperature_2m_min:+wx.tmin,
  wind_speed_10m_max:+wx.wind,shortwave_radiation_sum:+wx.rad,relative_humidity_2m_mean:+wx.rh,
  precipitation_sum:+wx.rain,day_of_season:dos,et0_yesterday:yest,et0_3day_mean:mean3,et0_change:chg};
 return M.features.map(f=>by[f]);
}

/* Standardise with the EXPORTED train-set statistics, then apply the linear model.
   This is exactly what sklearn's Pipeline does: (x - mean) / scale, then dot(coef) + intercept. */
function predictModel(i,wx){
 const x=features(i,wx);
 let yhat=M.intercept;
 for(let j=0;j<x.length;j++) yhat+=M.coef[j]*((x[j]-M.mean[j])/M.scale[j]);
 return yhat;                                      // raw model output, before any clamp
}

/* The persistence rule, KEPT for comparison. It is no longer what the page shows, but the
   notebook's whole baseline argument rests on it, so it stays here, named, and callable. */
const predictPersistence=(wx)=>Math.max(0,+wx.et0||0);

/* What the page uses. Clamped at zero: ET0 is a loss of water and cannot be negative. */
const predict=(wx)=>Math.max(0,predictModel(LAST,wx));
/* ---- crop curve and water balance (FAO-56 Kc, notebook stage lengths) ---- */
const SEG=[25,55,45,25],KCI=.7,KCM=1.15,KCE=.4;
const kcAt=(d)=>{d=Math.max(0,Math.min(149,d));if(d<25)return KCI;if(d<80)return KCI+(KCM-KCI)*(d-24)/55;if(d<125)return KCM;return KCM+(KCE-KCM)*(d-124)/25};
const STAGES=[['Initial',0,25,'Emergence and early tillering'],['Development',25,80,'Tillering to jointing and booting'],['Mid-season',80,125,'Heading, flowering, early grain fill'],['Late season',125,150,'Grain fill to maturity']];
/* All three helpers below treat a date string as a CALENDAR date by pinning it to UTC
   midnight. Parsing as local midnight and then calling toISOString() shifted the date
   back a day in any timezone ahead of UTC (IST included), which made the crop timeline
   start the day before sowing. */
const dayDiff=(a,b)=>Math.round((new Date(b+'T00:00:00Z')-new Date(a+'T00:00:00Z'))/864e5);
const fmt=(d,o={day:'numeric',month:'short'})=>new Date(d+'T00:00:00Z').toLocaleDateString('en-GB',{...o,timeZone:'UTC'});
const add=(d,n)=>{const x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const sum=a=>a.reduce((s,x)=>s+x,0),r1=x=>Math.round(x*10)/10;
function calc(){
 const trig=+S.trig||60, idx=d=>D.dates.indexOf(d);
 let sowI=idx(S.sow);if(sowI<0)sowI=Math.max(0,LAST-136);
 const sow=D.dates[sowI], DAS=LAST-sowI;
 const kc=i=>kcAt(i-sowI);
 // Run the balance from sowing first, so an empty 'last irrigation' can fall back to
 // the most recent event this balance itself produces, rather than an invented date.
 let d2=0;const ev=[];for(let i=sowI;i<=LAST;i++){d2=Math.max(0,d2+kc(i)*Math.max(0,D.et0[i])-D.rain[i]);if(d2>=trig){ev.push(D.dates[i]);d2=0}}
 const lastEst=ev.length?ev[ev.length-1]:'', lastUsed=S.last||lastEst, lastIsEst=!S.last&&!!lastEst;
 const li=lastUsed?idx(lastUsed):-1, hasLast=li>=sowI&&li<=LAST;
 const start=hasLast?li+1:sowI;
 let def=0;const ser=[];
 for(let i=start;i<=LAST;i++){def=Math.max(0,def+kc(i)*Math.max(0,D.et0[i])-D.rain[i]);ser.push(r1(def))}
 const pet=predict(S.wx), kcT=kcAt(DAS+1), etcT=kcT*pet, rainT=+S.rainTom||0;
 const defT=Math.max(0,def+etcT-rainT);
 const days=defT>=trig?0:Math.ceil((trig-defT)/Math.max(0.5,etcT)), yes=defT>=trig||days<=1;
 const rem=Math.max(0,trig-def);
 // 1 mm of depth over 1 hectare = 10 cubic metres (the notebook's arithmetic).
 const areaHa=S.areaUnit=='acres'?S.area*ACRE_HA:S.area;
 const qtyMm=Math.round(defT*10)/10, m3=Math.round(qtyMm*10*areaHa);
 const w7=(f)=>sum(D[f].slice(-7));
 return {trig,sowI,sow,DAS,hasLast,ser,ev,areaHa,lastEst,lastIsEst,lastUsed,def:r1(def),pet:r1(pet),kcNow:kcAt(DAS),kcT,etcT:r1(etcT),defT:r1(defT),days,yes,rem,qtyMm,m3,
  etcNow:r1(kcAt(DAS)*D.et0[LAST]),rain7:r1(w7('rain')),et07:r1(w7('et0')),pct:Math.max(0,Math.min(100,Math.round(100*(1-def/trig)))),
  sinceLast:hasLast?dayDiff(lastUsed,ASOF):null}
}

/* ---- display helpers (no calculation) -------------------------------------------- */
// "1 hectare" but "2 hectares"; same for acres.
const plural=(n,unit)=>`${n} ${(+n===1)?unit.replace(/s$/,''):unit}`;
/* ---- presentation ---------------------------------------------------------------- */
const mm=x=>`${x}<small> mm</small>`;
const asOf=()=>fmt(ASOF,{day:'numeric',month:'short',year:'numeric'});
function chart(c,w,h){
 const s=c.ser.slice(-30), all=[...s,c.defT], mx=Math.max(c.trig,...all)*1.12, n=all.length;
 const X=i=>8+i*(w-16)/Math.max(1,n-1), Y=v=>h-14-(v/mx)*(h-26);
 if(s.length<1)return '<div class="k">No days since last irrigation yet.</div>';
 const pts=s.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
 const li=s.length-1;
 return `<svg viewBox="0 0 ${w} ${h}" width="100%"><path d="M${X(0)},${h-14} L${pts.replaceAll(' ',' L')} L${X(li)},${h-14}Z" fill="var(--mint)" opacity=".22"/><line x1="8" x2="${w-8}" y1="${Y(c.trig)}" y2="${Y(c.trig)}" stroke="var(--coral)" stroke-dasharray="3 3"/><text x="${w-8}" y="${Y(c.trig)-3}" text-anchor="end">${c.trig} mm trigger</text><polyline points="${pts}" fill="none" stroke="var(--teal)" stroke-width="1.8"/><line x1="${X(li)}" y1="${Y(s[li])}" x2="${X(n-1)}" y2="${Y(c.defT)}" stroke="var(--gold)" stroke-width="1.8" stroke-dasharray="3 2"/><circle cx="${X(li)}" cy="${Y(s[li])}" r="3" fill="var(--teal)"/><circle cx="${X(n-1)}" cy="${Y(c.defT)}" r="3.4" fill="var(--gold)"/><text x="8" y="${h-3}">${fmt(D.dates[LAST-s.length+1])}</text><text x="${w-8}" y="${h-3}" text-anchor="end">Tomorrow</text></svg>`;
}
/* 5a: the ring only. Its caption now sits BELOW the svg as ordinary text, so it is fully
   readable instead of being squeezed inside the circle. The percentage is unchanged. */
function gauge(p){const R=44,C=2*Math.PI*R;return `<svg viewBox="0 0 110 110" width="128" role="img" aria-label="${p}% of trigger remaining"><circle cx="55" cy="55" r="${R}" fill="none" stroke="var(--pale)" stroke-width="9"/><circle cx="55" cy="55" r="${R}" fill="none" stroke="var(--teal)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C*p/100} ${C}" transform="rotate(-90 55 55)"/><text x="55" y="63" text-anchor="middle" style="font-size:26px;font-weight:800;fill:#243338">${p}%</text></svg>`}
const inp=(id,label,val,type='number',extra='')=>`<div class="f"><label for="${id}">${label}</label><input id="${id}" data-k="${id}" type="${type}" value="${val}" ${extra}></div>`;
const sel=(id,label,val,opts)=>`<div class="f"><label for="${id}">${label}</label><select id="${id}" data-k="${id}">${opts.map(o=>`<option ${o==val?'selected':''}>${o}</option>`).join('')}</select></div>`;

/* ---- screens. Each returns the inner HTML for one screen. ------------------------- */
const SCREENS={
 home:{title:'Home',tab:'home',body:(c,dec,when)=>`
  <div class="card hero"><small>Irrigation recommendation</small><div style="font-size:12.5px;opacity:.85;margin-top:3px">As of ${asOf()}</div>
   <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0;flex-wrap:wrap"><span class="big ${c.yes?'yes':'no'}">${dec}</span><span class="pill">${c.trig} mm trigger</span></div>
   <div style="font-size:15px;font-weight:600">${when}</div>${noRain()}</div>
  <div class="two">
   <div class="card"><div class="k">Estimated water deficit</div><div class="v">${mm(c.def)}</div><div class="k">${c.rem.toFixed(1)} mm to trigger</div></div>
   <div class="card"><div class="k">Next irrigation</div><div class="v">${c.yes?'Now':'in '+c.days+' d'}</div><div class="k">${plural(S.area,S.areaUnit)}</div></div></div>
  <div class="card"><div class="k" style="margin-bottom:6px">Tomorrow's estimated crop water use (our model)</div>
   <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><div class="v">${c.pet}<small> mm</small></div>
   <div class="k">Estimated ET0<br>Our model (11 features)<br>Crop use ${c.etcT} mm</div></div></div>`},

 field:{title:'My Field',tab:'field',body:(c)=>`
  <div class="card fl"><div class="two">${inp('area','Field area (example: 1)',S.area,'number','min="0.1" step="0.1"')}${sel('areaUnit','Unit',S.areaUnit,['hectares','acres'])}</div>
   <div class="k">1 acre = ${ACRE_HA} hectares. ${S.areaUnit=='acres'?`${plural(S.area,'acres')} = ${r1(c.areaHa)} ha.`:''}</div>
   ${sel('trig','Trigger scenario (mm of deficit)',S.trig,TRIGGERS)}
   <div class="k">FAO-56 sets the trigger from soil texture and rooting depth, which we do not have for Karnal. These are scenarios, not soil measurements.</div>
   ${inp('sow','Sowing date &mdash; replay season '+SEASON,S.sow,'date',`min="${SOW_MIN}" max="${SOW_MAX}"`)}
   ${inp('last','Last irrigation (blank if none)',S.last,'date',`min="${S.sow}" max="${ASOF}"`)}
   <div class="k">${c.lastIsEst?`Using ${fmt(c.lastUsed,{day:'numeric',month:'short',year:'numeric'})} &mdash; estimated by the water balance; enter your own date if you irrigated.`:(c.hasLast?'Using the date you entered.':'No irrigation assumed since sowing.')}</div></div>
  <div class="card"><div class="row"><span class="k">Trigger scenario</span><b>${c.trig} mm</b></div><div class="row"><span class="k">Kc today</span><b>${c.kcNow.toFixed(2)}</b></div><div class="row"><span class="k">Days after sowing</span><b>${c.DAS}</b></div></div>
  <button class="reset" id="reset" type="button">Reset all inputs</button>`},

 weather:{title:'Weather',tab:'weather',body:(c)=>{const days7=[...Array(7)].map((_,i)=>LAST-6+i);return `
  <div class="card"><div class="k">Last 7 days, Karnal</div><div class="wk">${days7.map(i=>`<div><div class="k">${fmt(D.dates[i],{weekday:'short'}).slice(0,3)}</div><div style="font-weight:800;margin-top:3px">${Math.round(D.tmax[i])}&deg;</div><div class="k">${Math.round(D.tmin[i])}&deg;</div><div style="height:${Math.min(34,Math.max(2,D.rain[i]*4))}px;background:var(--mint);border-radius:3px;margin:6px 5px 0"></div><div class="k">${D.rain[i]}</div></div>`).join('')}</div></div>
  <div class="card fl"><div class="k">Today's weather (editable)</div><div class="k">Enter rain from your own forecast. This page has no forecast feed.</div>
   <div class="two">${inp('w_et0','ET0 today mm',S.wx.et0,'number','step="0.1"')}${inp('rainTom','Rain expected tomorrow (mm)',S.rainTom,'number','step="0.1" min="0"')}</div></div>
  <div class="card hero"><small>Tomorrow's estimated ET0 (our model)</small><div class="big" style="font-size:34px;margin-top:6px">${c.pet} <span style="font-size:15px;font-weight:600">mm</span></div></div>`}},

 water:{title:'Water',tab:'water',menu:[['balance','Water balance','Deficit, crop use and rain over the last 30 days'],['decision','Irrigation decision','The recommendation, with the reasons behind it'],['history','History','Irrigations called this season and season totals']]},
 more:{title:'More',tab:'more',menu:[['timeline','Crop timeline','Growth stages and how water demand changes'],['settings','Settings','Inputs, units and data sources'],['about','About this prototype','What it is, what it is not, and its limits']]},

 balance:{title:'Water balance',tab:'water',back:'water',body:(c)=>`
  <div class="card" style="display:grid;justify-items:center;text-align:center;gap:4px">${gauge(c.pct)}
   <div style="font-weight:700;color:var(--deep)">% of trigger remaining</div>
   <div class="k">estimated from weather, not measured in the field</div></div>
  <div class="two">
   <div class="card"><div class="k">Crop use today</div><div class="v">${mm(c.etcNow)}</div></div>
   <div class="card"><div class="k">Rain, 7 days</div><div class="v">${mm(c.rain7)}</div></div>
   <div class="card"><div class="k">Deficit now</div><div class="v" style="color:var(--coral)">${mm(c.def)}</div></div>
   <div class="card"><div class="k">Tomorrow</div><div class="v" style="color:var(--teal)">${mm(c.defT)}</div></div></div>
  <div class="card"><div class="k">Estimated water deficit</div>${chart(c,300,120)}</div>`},

 decision:{title:'Irrigation decision',tab:'water',back:'water',body:(c,dec,when)=>`
  <div class="card hero"><div style="font-size:12.5px;opacity:.85;margin-bottom:5px">As of ${asOf()} &middot; ${when}</div>
   <div class="big ${c.yes?'yes':'no'}">${dec}</div>${noRain()}
   <div style="font-size:12px;opacity:.85;margin-top:7px">In our tests this model gave the same irrigation dates as the simple persistence rule.</div></div>
  ${c.yes?`<div class="two">
   <div class="card"><div class="k">Amount to apply</div><div class="v">${mm(c.trig)}</div><div class="k">one trigger's worth, the way the notebook counts water (events &times; trigger); resets our estimated deficit to zero (assumed; application losses are not modelled)</div></div>
   <div class="card"><div class="k">Water for ${plural(S.area,S.areaUnit)}</div><div class="v">${applyM3(c)}<small> m&sup3;</small></div><div class="k">${c.trig} mm &times; ${r1(c.areaHa)} ha &times; 10 = ${applyM3(c)} m&sup3;</div><div class="k">${(applyM3(c)*1000).toLocaleString('en-IN')} litres</div></div></div>`
  :`<div class="card"><div class="k">Amount to apply</div><div class="v" style="font-size:20px">${r1(c.trig-c.defT)} mm short of the trigger</div><div class="k">No amount or volume is shown until the deficit reaches the ${c.trig} mm trigger.</div></div>`}
  <div class="card"><b style="color:var(--deep)">Why?</b>
   <div class="why"><i></i><span>Deficit is ${c.def} mm, ${c.defT} mm after tomorrow's predicted use, against the ${c.trig} mm trigger scenario.</span></div>
   <div class="why"><i></i><span>Tomorrow's ET0 is taken as ${c.pet} mm and you expect ${(+S.rainTom||0)} mm of rain.</span></div>
   <div class="why"><i></i><span>${STAGES.find(s=>c.DAS>=s[1]&&c.DAS<s[2])?.[0]||'Season end'} stage, Kc ${c.kcNow.toFixed(2)}.${c.hasLast?` Last irrigated ${c.sinceLast} days ago.`:''}</span></div></div>`},

 history:{title:'History',tab:'water',back:'water',body:(c)=>{const evs=c.ev.slice().reverse();return `
  <div class="two">
   <div class="card"><div class="k">Irrigations called</div><div class="v">${c.ev.length}</div></div>
   <div class="card"><div class="k">Water applied</div><div class="v">${Math.round(c.ev.length*c.trig*10*c.areaHa)}<small> m&sup3;</small></div><div class="k">${c.ev.length} &times; ${c.trig} mm &times; ${r1(c.areaHa)} ha &times; 10</div></div>
   <div class="card"><div class="k">Season rain</div><div class="v">${mm(r1(sum(D.rain.slice(c.sowI))))}</div></div>
   <div class="card"><div class="k">Crop use</div><div class="v">${mm(r1(sum(D.et0.slice(c.sowI).map((e,i)=>e*kcAt(i)))))}</div></div></div>
  <div class="card">${evs.length?evs.map(e=>`<div class="row"><span>${fmt(e,{day:'numeric',month:'short',year:'numeric'})}</span><span class="tag">${c.trig} mm</span></div>`).join(''):'<div class="k">None called yet.</div>'}</div>`}},

 timeline:{title:'Crop timeline',tab:'more',back:'more',body:(c)=>`
  <div class="card"><div class="k">Wheat &middot; sown ${fmt(c.sow)} &middot; replay season ${SEASON}</div>
   <div class="k" style="margin:6px 0 12px">Stage lengths are adapted to a roughly 150-day Haryana season. They are not a FAO-56 table row.</div>
   <div class="tl">${STAGES.map(([n,a,b,t])=>{const cls=c.DAS>=b?'done':(c.DAS>=a?'now':'');return `<div class="st ${cls}"><div class="dot"></div><div><b>${n}</b><div class="k">${fmt(add(c.sow,a))} to ${fmt(add(c.sow,b-1))} &middot; ${b-a} days</div><div class="k">${t} &middot; Kc ${kcAt(a).toFixed(2)} to ${kcAt(b-1).toFixed(2)}</div>${cls=='now'?`<div class="tag gold" style="display:inline-block;margin-top:5px">Now &middot; day ${c.DAS-a+1} of ${b-a}</div>`:''}</div></div>`}).join('')}</div></div>`},

 settings:{title:'Settings',tab:'more',back:'more',body:(c)=>`
  <div class="card"><div class="row"><span>Trigger scenario</span><b>${c.trig} mm</b></div><div class="row"><span>Field</span><b>${plural(S.area,S.areaUnit)} (${r1(c.areaHa)} ha)</b></div><div class="row"><span>Units</span><b>mm, &deg;C, km/h</b></div><div class="row"><span>Weather source</span><b>Open-Meteo</b></div><div class="row"><span>Cross-check</span><b>NASA POWER</b></div><div class="row"><span>Latest data</span><b>${asOf()}</b></div></div>
  <div class="card"><div class="k">Method</div><div style="font-weight:600;margin:3px 0">FAO-56 water balance</div><div class="k">Daily deficit = crop use (Kc &times; ET0) minus rain. Irrigate when the deficit reaches the trigger.</div></div>`},

 about:{title:'About this prototype',tab:'more',back:'more',body:(c)=>`
  <div class="card about">
   <h3>What this is</h3>
   <p>Prototype of a farmer-facing app. It replays archived weather for Karnal up to ${asOf()}. It is not a live system. Tomorrow's ET0 comes from our linear regression model (test error 0.298 mm/day; the public Open-Meteo forecast scores 0.143). This is a prototype, not expert farm advice.</p>
   <h3>How to use it</h3>
   <p>Type into <b>My Field</b> (area, trigger scenario, sowing date, last irrigation) or <b>Weather</b> (today's ET0, expected rain) and every screen updates.</p>
   <h3>Sources</h3>
   <p>Open-Meteo (ERA5) and NASA POWER daily data to ${asOf()}. ET0 is calculated (FAO-56 Penman-Monteith), not measured in a field.</p>
   <h3>Limits you should know</h3>
   <ul>
    <li>The trigger deficit is a scenario (40, 60 or 80 mm, the notebook's range), not a soil measurement: we have no soil texture or rooting-depth data for Karnal.</li>
    <li>The gauge is estimated from weather, not measured in the field.</li>
    <li>Stage lengths are adapted to a roughly 150-day Haryana season. They are not a FAO-56 table row.</li>
    <li>Irrigating resets our estimated deficit to zero (assumed; application losses are not modelled).</li>
    <li>This page has no forecast feed. Rain expected tomorrow is whatever you type.</li>
    <li>In our tests this model gave the same irrigation dates as the simple persistence rule, so the model changes nothing we could measure.</li>
    <li>Nothing here has been checked against a real field.</li>
   </ul></div>`}
};
const noRain=()=>(+S.rainTom||0)===0?'<div style="font-size:12.5px;opacity:.85;margin-top:6px">assumes no rain tomorrow</div>':'';
/* 5b: the volume shown is one trigger's worth, matching how the notebook counts water. */
const applyM3=(c)=>Math.round(c.trig*10*c.areaHa);
const TABS=[['home','Home'],['field','My Field'],['weather','Weather'],['water','Water'],['more','More']];

/* ---- routing: the URL hash is the single source of truth for which screen shows ----
   #home, #field, #weather, #water, #balance, #decision, #history, #timeline,
   #settings, #about. Because navigation goes through the hash, the browser's back
   button and a page refresh both work, and S (the inputs) is never reset by either. */
const route=()=>{const h=(location.hash||'#home').slice(1);return SCREENS[h]?h:'home'};
function go(id){ if(location.hash.slice(1)!==id) location.hash=id; else render(); }

function navHTML(cur,cls){
 const on=SCREENS[cur].tab;
 return TABS.map(([id,label])=>`<a href="#${id}" class="${id===on?'on':''}" ${id===on?'aria-current="page"':''}><i></i>${label}</a>`).join('');
}

function render(){
 const id=route(), S_=SCREENS[id], c=calc();
 const dec=c.yes?'YES':'NO';
 const when=c.yes?(c.days==0?'Irrigate tomorrow':'Irrigate within 1 day'):`Next irrigation in about ${c.days} days`;
 // Menu screens (Water, More) list their sub-screens; the rest render their own body.
 const html=S_.menu
  ? `<div class="menu">${S_.menu.map(([to,label,desc])=>`<a href="#${to}"><span><b>${label}</b><span>${desc}</span></span><span class="chev">&rsaquo;</span></a>`).join('')}</div>`
  : S_.body(c,dec,when);
 document.getElementById('scr').innerHTML=html;
 document.getElementById('title').textContent=S_.title;
 // The back arrow appears only on sub-screens, and returns to that section's index.
 const back=document.getElementById('back');
 back.hidden=!S_.back;
 back.onclick=()=>{ if(S_.back) go(S_.back) };
 document.getElementById('tabs').innerHTML=navHTML(id);
 document.getElementById('sidebar').innerHTML=
  `<div class="brand">Karnal Wheat<br>Irrigation Advisor</div>`+navHTML(id);
 const r=document.getElementById('reset');
 if(r) r.onclick=()=>{S=JSON.parse(JSON.stringify(DEF));render()};
}

function onEdit(e){
 const el=e.target.closest('[data-k]');if(!el)return;
 const k=el.dataset.k,v=el.value, id=el.id, pos=el.selectionStart;
 if(k.startsWith('w_'))S.wx[k.slice(2)]=v===''?0:+v;
 // Area must be strictly positive: zero or negative is rejected and the last good value kept.
 else if(k=='area'){const n=+v; S.area=(isFinite(n)&&n>0)?n:S.area}
 else if(k=='trig')S.trig=+v;
 else if(k=='rainTom')S.rainTom=v; else S[k]=v;
 if(k=='sow'&&S.last&&S.last<=S.sow)S.last='';
 render();
 // Re-focus the field being typed in: render() replaces the DOM node under the cursor.
 const n=document.getElementById(id);if(n&&e.type=='input'&&el.tagName=='INPUT'){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}
}
document.addEventListener('input',onEdit);
document.addEventListener('change',e=>{if(e.target.tagName=='SELECT')onEdit(e)});
window.addEventListener('hashchange',render);
render();
</script>
